# Started from /admin/pm/architecture ("Update architecture", needs GITHUB_DISPATCH_TOKEN on Vercel) or by hand
# from the Actions tab. Claude runs Archify on the repository and the result arrives as a pull request.
# Needs the repository secret ANTHROPIC_API_KEY. docs/architecture-snapshots.md has the setup.
name: Refresh architecture

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: refresh-architecture
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the Archify skill (MIT); its browser check uses the Chrome already on the runner
      - name: Install Archify
        run: |
          git clone --depth 1 https://github.com/tt-a1i/archify.git "$RUNNER_TEMP/archify-src"
          mkdir -p .claude/skills
          cp -r "$RUNNER_TEMP/archify-src/archify" .claude/skills/archify
          node .claude/skills/archify/bin/archify.mjs --help > /dev/null

      - name: Redraw the diagrams
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow .claude/commands/refresh-architecture.md exactly. The Archify skill is in .claude/skills/archify.
            You are on a clean checkout of main in CI: do not create a branch or commit, a later step does that.
            Change only files under src/lib/pm/diagrams/.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node:*),Bash(git log:*),Bash(git diff:*),Bash(git rev-parse:*),Bash(git status:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(date:*)"

      - name: Only the diagrams changed
        run: |
          bad=$(git status --porcelain | grep -vE '^( M|\?\?|A ) (src/lib/pm/diagrams/|\.claude/skills/archify/|\.archify/)' || true)
          if [ -n "$bad" ]; then echo "::error::Files outside src/lib/pm/diagrams changed:"; echo "$bad"; exit 1; fi
          test -n "$(git status --porcelain src/lib/pm/diagrams)" || { echo "::error::No new snapshot was written"; exit 1; }

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/architecture-snapshot
          add-paths: src/lib/pm/diagrams
          commit-message: "Architecture snapshot"
          title: "Architecture snapshot"
          body: |
            Claude redrew the architecture diagrams with Archify from `main`. It starts from the previous snapshot,
            adds a new dated one and leaves every older snapshot as it was.

            Look at the new snapshot in /admin/pm/architecture on the preview, then merge: the out-of-date notice clears.
            Generated by the Refresh architecture workflow (docs/architecture-snapshots.md).
          labels: no-changelog
